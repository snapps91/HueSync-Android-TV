name: Android

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: huesync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUESYNC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HUESYNC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUESYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HUESYNC_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'Release signing secrets are missing.' >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huesync-release.jks"
      - name: Build signed release APK
        env:
          HUESYNC_KEYSTORE_PATH: ${{ runner.temp }}/huesync-release.jks
          HUESYNC_KEYSTORE_PASSWORD: ${{ secrets.HUESYNC_KEYSTORE_PASSWORD }}
          HUESYNC_KEY_ALIAS: ${{ secrets.HUESYNC_KEY_ALIAS }}
          HUESYNC_KEY_PASSWORD: ${{ secrets.HUESYNC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK and version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          version = metadata['elements'][0]['versionName']
          tag = os.environ['GITHUB_REF_NAME']
          if tag.removeprefix('v') != version:
              raise SystemExit(f'Tag {tag} does not match app version {version}')
          PY
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)" verify "$apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          release_apk="$RUNNER_TEMP/HueSync-$GITHUB_REF_NAME.apk"
          cp "$apk" "$release_apk"
          gh release create "$GITHUB_REF_NAME" "$release_apk" \
            --verify-tag --title "HueSync $GITHUB_REF_NAME" --generate-notes
